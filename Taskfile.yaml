version: 3

set: [errexit, nounset, pipefail]

env:
  RABBITMQ_OPERATOR_VERSION:
    sh: echo "${RABBITMQ_OPERATOR_VERSION:-v2.20.0}"
  SCYLLA_OPERATOR_VERSION:
    sh: echo "${SCYLLA_OPERATOR_VERSION:-v1.20.2}"

tasks:
  up:
    desc: Brings up an Astarte cluster on kind
    deps:
      - terraform-apply

  down:
    desc: Tears down the kind Astarte cluster
    deps:
      - cleanup

  create-cluster:
    if: kind get clusters -q | not grep -q kind
    deps:
      - tmp-dir
    cmd: kind create cluster --kubeconfig ./.tmp/config.yml --config ./manifests/kind-config.yml

  terraform-apply:
    deps:
      - create-cluster
      - download-rabbitmq-chart
      - download-scylla-chart
    cmd: terraform apply

  download-rabbitmq-chart:
    deps:
      - tmp-dir
    interactive: true
    if: test ! -f ./.tmp/rabbitmq-cluster-operator.yml
    cmd: wcurl -o ./.tmp/rabbitmq-cluster-operator.yml "https://github.com/rabbitmq/cluster-operator/releases/download/$RABBITMQ_OPERATOR_VERSION/cluster-operator.yml"

  download-scylla-chart:
    deps:
      - tmp-dir
    interactive: true
    if: test ! -f ./.tmp/scylla-cluster-operator.yml
    cmd: wcurl -o ./.tmp/scylla-cluster-operator.yml "https://raw.githubusercontent.com/scylladb/scylla-operator/$SCYLLA_OPERATOR_VERSION/deploy/operator.yaml"

  cleanup:
    ignore_error: true
    cmds:
      - kind delete cluster
      - rm -rf .tmp

  tmp-dir:
    internal: true
    generates:
      - ./.tmp/
    cmd: mkdir -p .tmp
